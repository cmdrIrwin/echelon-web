<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OZ OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#161616; --ink:#d6e8de; --green:#4f8a6b; --red:#ff5252; --blue:#0047b3; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:#0b0b0b; color:var(--ink);
      font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
    h1, h2, .title { font-family:"Michroma","Segoe UI",sans-serif; font-weight:400; }
    .screen { position:absolute; inset:0; display:none; }
    .screen.on { display:block; }

    /* 1. Login */
    #login.on { display:grid; place-items:center; background:radial-gradient(circle at center,#2a2a2a,#0b0b0b 75%); }
    .box { width:min(340px, 90vw); }
    .box h1 { color:var(--green); font-size:1.8rem; margin:0 0 4px; }
    .box p { margin:0 0 20px; opacity:.8; }
    label { display:block; font-size:.9rem; margin-bottom:4px; }
    input { width:100%; padding:10px 12px; margin-bottom:14px; background:#111; color:var(--ink);
      border:2px solid var(--green); border-radius:0; font:inherit; }
    input:focus-visible, button:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
    button { font:inherit; cursor:pointer; background:var(--green); color:#0b0b0b; border:0; padding:10px 18px; }
    button:hover { background:var(--ink); }

    /* 1b. Pixel look for the login. Swap fonts, colours and the pattern here when your art is ready. */
    #login { font-family:"Press Start 2P","Courier New",monospace; image-rendering:pixelated; }
    /* Clean background with the same vignette as startup.png. The colours were measured from the PNG.
       Lighter centre, darker edges. To make the vignette stronger, darken the later stops. */
    #login.on {
      background: radial-gradient(ellipse 50% 71% at 50% 50%,
        #282928 0%, #212221 50%, #181918 70%, #0e0f0e 90%, #070807 110%, #040404 130%);
    }
    #login .box { width:min(380px,92vw); padding:24px; background:#0b0b0b;
      border:4px solid var(--green); box-shadow:8px 8px 0 #000; }
    #login h1 { font-family:inherit; font-size:1.3rem; margin:0 0 12px; }
    #login p, #login label { font-size:.6rem; line-height:1.8; }
    #login label { margin-bottom:8px; }
    #login input { font-family:inherit; font-size:.7rem; border:4px solid var(--green); padding:10px; margin-bottom:18px; }
    #login button { font-family:inherit; font-size:.7rem; border:4px solid #000; padding:10px 16px;
      box-shadow:4px 4px 0 #000; }
    #login button:active { transform:translate(4px,4px); box-shadow:none; }

    /* 2. Boot overlay. Timeline (change the seconds to taste):
          0s to 5s   black screen
          5s to 6.6s the PNG fades in
          6.6s to 9s the PNG holds
          9s to 10.6s everything fades away, revealing the login
       steps() makes the fades choppy, like old hardware. */
    #boot { position:fixed; inset:0; z-index:100; background:#000; display:grid; place-items:center;
      animation:boot-out 1.6s steps(8) 9s forwards; }
    #boot img { display:block; width:100%; height:100%; object-fit:cover; opacity:0;
      animation:boot-in 1.6s steps(8) 5s forwards; }
    #boot::after { content:""; position:absolute; inset:0; pointer-events:none;
      background:repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.2) 2px 3px); }
    @keyframes boot-in  { to { opacity:1; } }
    @keyframes boot-out { to { opacity:0; visibility:hidden; } }
    /* "cover" fills any computer screen. On tall or narrow screens (phones) it would crop the logo,
       so show the whole image there instead. */
    @media (max-aspect-ratio: 1/1) {
      #boot { background:#0a0a0a; }
      #boot img { object-fit:contain; }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot { animation-duration:.01s; animation-delay:0s; }
      #boot img { animation:none; }
    }

    /* 3. Desktop */
    #desktop { background:radial-gradient(circle at center,#262626,#0f0f0f 80%); }
    .icons { position:absolute; top:20px; left:20px; display:grid; gap:18px; }
    .icon { width:92px; text-align:center; background:none; color:var(--ink); padding:6px; }
    .icon:hover { background:rgba(79,138,107,.25); }
    .icon .glyph { display:block; width:44px; height:44px; margin:0 auto 6px; border:3px solid var(--green); }
    .icon:nth-child(1) .glyph { border-color:var(--red); }
    .icon:nth-child(3) .glyph { border-color:var(--blue); }
    .win { position:absolute; width:min(420px, 92vw); background:var(--bg); border:2px solid var(--green); display:none; }
    .win.on { display:block; }
    .bar { display:flex; justify-content:space-between; align-items:center; padding:6px 10px;
      background:var(--green); color:#0b0b0b; cursor:move; touch-action:none; user-select:none; }
    .bar .title { font-size:.8rem; }
    .bar button { padding:0 8px; background:#0b0b0b; color:var(--ink); }
    .body { padding:16px 18px; }
    .body p { margin:0 0 10px; }
    .body a { color:var(--red); }
    #taskbar { position:absolute; left:0; right:0; bottom:0; height:44px; display:flex; align-items:center;
      justify-content:space-between; padding:0 14px; background:#0b0b0b; border-top:3px solid var(--green); }
    #taskbar button { padding:4px 12px; }
    #clock { font-family:"Michroma",sans-serif; font-size:.75rem; color:var(--green); }
  </style>
</head>
<body>

  <!-- Login -->
  <div id="login" class="screen on" inert>
    <div class="box">
      <h1>OZ OS</h1>
      <p>Larrikin L'ectronics. Please log in.</p>
      <label for="user">User</label>
      <input id="user" value="cmdr_irwin" autocomplete="off">
      <label for="pass">Password</label>
      <input id="pass" type="password" placeholder="Any password works">
      <button id="go">Log in</button>
    </div>
  </div>

  <!-- Boot screen (startup.png) -->
  <div id="boot">
    <img src="startup.png" alt="OZ OS startup screen">
  </div>

  <!-- Desktop -->
  <div id="desktop" class="screen">
    <div class="icons">
      <button class="icon" data-win="about"><span class="glyph"></span>About</button>
      <button class="icon" data-win="projects"><span class="glyph"></span>Projects</button>
      <button class="icon" data-win="lore"><span class="glyph"></span>Lore</button>
      <button class="icon" data-win="contact"><span class="glyph"></span>Contact</button>
    </div>

    <!-- EDIT ME: change the words inside each window. -->
    <div class="win" id="about" style="top:60px;left:140px">
      <div class="bar"><span class="title">About</span><button data-close>x</button></div>
      <div class="body"><p>Commander Irwin Crocky. Write a few sentences about yourself here.</p></div>
    </div>
    <div class="win" id="projects" style="top:100px;left:180px">
      <div class="bar"><span class="title">Projects</span><button data-close>x</button></div>
      <div class="body"><p>List your best work here.</p><p><a href="https://github.com/cmdrIrwin">My GitHub</a></p></div>
    </div>
    <div class="win" id="lore" style="top:140px;left:220px">
      <div class="bar"><span class="title">Lore</span><button data-close>x</button></div>
      <div class="body"><p>Welcome to the OZ OS universe. Add your stories, characters and timelines here.</p></div>
    </div>
    <div class="win" id="contact" style="top:180px;left:260px">
      <div class="bar"><span class="title">Contact</span><button data-close>x</button></div>
      <div class="body"><p>Tell people how to reach you here.</p></div>
    </div>

    <div id="taskbar">
      <button id="shutdown">Log out</button>
      <span id="clock"></span>
    </div>
  </div>

<script>
  const $ = (s) => document.querySelector(s);
  const show = (id) => {
    document.querySelectorAll(".screen").forEach((s) => s.classList.remove("on"));
    $("#" + id).classList.add("on");
  };

  // When the boot overlay finishes fading, remove it and unlock the login.
  const boot = $("#boot");
  boot.addEventListener("animationend", (e) => {
    if (e.target !== boot) return; // ignore the image's own fade
    boot.remove();
    $("#login").removeAttribute("inert");
    $("#user").focus();
  });

  // Login -> desktop. Any input is accepted; nothing is checked.
  function logIn() { show("desktop"); }
  $("#go").addEventListener("click", logIn);
  $("#pass").addEventListener("keydown", (e) => { if (e.key === "Enter") logIn(); });
  $("#shutdown").addEventListener("click", () => {
    document.querySelectorAll(".win").forEach((w) => w.classList.remove("on"));
    show("login");
  });

  // Open and close windows
  let top = 10;
  const raise = (w) => { w.style.zIndex = ++top; };
  document.querySelectorAll(".icon").forEach((i) =>
    i.addEventListener("click", () => { const w = $("#" + i.dataset.win); w.classList.add("on"); raise(w); }));
  document.querySelectorAll("[data-close]").forEach((b) =>
    b.addEventListener("click", () => b.closest(".win").classList.remove("on")));

  // Drag windows by their title bar
  document.querySelectorAll(".win").forEach((w) => {
    const bar = w.querySelector(".bar");
    bar.addEventListener("pointerdown", (e) => {
      if (e.target.closest("button")) return;
      raise(w);
      const dx = e.clientX - w.offsetLeft, dy = e.clientY - w.offsetTop;
      const move = (m) => { w.style.left = m.clientX - dx + "px"; w.style.top = m.clientY - dy + "px"; };
      const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); };
      addEventListener("pointermove", move);
      addEventListener("pointerup", up);
    });
  });

  // Clock
  const tick = () => { $("#clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };
  tick(); setInterval(tick, 10000);
</script>
</body>
</html>
